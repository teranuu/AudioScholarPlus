services:
  - type: web
    name: audioscholarplus
    runtime: docker
    rootDir: backend/audioscholar
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://audioscholar.vercel.app
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: MULTI_SOURCE_RECONCILIATION_ENABLED
        value: "true"
      - key: MULTI_SOURCE_RECONCILIATION_INTERVAL_MS
        value: "900000"
      - key: MULTI_SOURCE_RECONCILIATION_MAX_JOBS_PER_RUN
        value: "25"
      - key: VALIDATION_EXPORT_ENABLED
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: NHOST_STORAGE_URL
        sync: false
      - key: NHOST_ADMIN_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
