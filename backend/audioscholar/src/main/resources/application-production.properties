# ===================================================================
# RENDER PRODUCTION – 512 MB FINAL (NOV 2025)
# ===================================================================

# Logging overrides (minimal)
logging.file.name=
logging.level.root=WARN
logging.level.edu.cit.audioscholar=INFO

# Tomcat overrides (tiny)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=50
server.tomcat.connection-timeout=20000
server.tomcat.max-keep-alive-requests=100
server.tomcat.accesslog.enabled=false

# RabbitMQ overrides (lean)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
audio.upload.worker-concurrency=${AUDIO_UPLOAD_WORKER_CONCURRENCY:2}
audio.upload.worker-max-concurrency=${AUDIO_UPLOAD_WORKER_MAX_CONCURRENCY:2}
audio.pptx.worker-concurrency=${AUDIO_PPTX_WORKER_CONCURRENCY:1}
audio.pptx.worker-max-concurrency=${AUDIO_PPTX_WORKER_MAX_CONCURRENCY:1}
audio.transcription.worker-concurrency=${AUDIO_TRANSCRIPTION_WORKER_CONCURRENCY:1}
audio.transcription.worker-max-concurrency=${AUDIO_TRANSCRIPTION_WORKER_MAX_CONCURRENCY:1}
audio.transcription.concurrency=${AUDIO_TRANSCRIPTION_CHUNK_CONCURRENCY:2}
audio.summarization.worker-concurrency=${AUDIO_SUMMARIZATION_WORKER_CONCURRENCY:1}
audio.summarization.worker-max-concurrency=${AUDIO_SUMMARIZATION_WORKER_MAX_CONCURRENCY:1}
audio.recommendation.worker-concurrency=${AUDIO_RECOMMENDATION_WORKER_CONCURRENCY:1}
audio.recommendation.worker-max-concurrency=${AUDIO_RECOMMENDATION_WORKER_MAX_CONCURRENCY:1}
gemini.guardrails.project-rpm=${GEMINI_PROJECT_RPM:10}
gemini.guardrails.project-input-tpm=${GEMINI_PROJECT_INPUT_TPM:200000}
gemini.guardrails.project-rpd=${GEMINI_PROJECT_RPD:500}
gemini.guardrails.user-rpm=${GEMINI_USER_RPM:0}
gemini.guardrails.user-input-tpm=${GEMINI_USER_INPUT_TPM:0}

# Hikari overrides (if used)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# --- Memory Saving Toggles ---
spring.jmx.enabled=false
spring.jpa.open-in-view=false

# Cache override
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=250,expireAfterAccess=8m

# Virtual threads
spring.threads.virtual.enabled=true

# CRITICAL: Force Render's dynamic port (with default fallback)
server.port=${PORT:10000}

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=false

# The login API does not depend on RabbitMQ. Keep the public health check focused
# on whether the HTTP service is ready to receive authentication requests.
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
